<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Task Scheduler - Agendador de Tarefas Inteligente">
    <title>Task Scheduler</title>
    <link rel="stylesheet" href="src/styles/main.css">
</head>
<body>
    <div id="app">
        <!-- Header/Navigation -->
        <header class="app-header" role="banner">
            <div class="header-content">
                <h1 class="app-title">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                        <line x1="16" y1="2" x2="16" y2="6"/>
                        <line x1="8" y1="2" x2="8" y2="6"/>
                        <line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                    Task Scheduler
                </h1>
                <nav class="main-nav" role="navigation" aria-label="Navegação principal">
                    <button class="nav-btn active" data-view="create" aria-current="page">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        <span>Nova Tarefa</span>
                    </button>
                    <button class="nav-btn" data-view="pending">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 11l3 3L22 4"/>
                            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                        </svg>
                        <span>Pendentes</span>
                        <span class="badge" id="pending-count" aria-live="polite">0</span>
                    </button>
                    <button class="nav-btn" data-view="completed">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                        <span>Concluídas</span>
                        <span class="badge" id="completed-count" aria-live="polite">0</span>
                    </button>
                    <button class="nav-btn" data-view="calendar">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                            <line x1="16" y1="2" x2="16" y2="6"/>
                            <line x1="8" y1="2" x2="8" y2="6"/>
                            <line x1="3" y1="10" x2="21" y2="10"/>
                        </svg>
                        <span>Calendário</span>
                    </button>
                </nav>
            </div>
        </header>

        <!-- Main Content -->
        <main class="app-main" role="main">
            <!-- Create Task View -->
            <section class="view active" id="view-create" role="region" aria-label="Criar nova tarefa">
                <header class="view-header">
                    <h2>Nova Tarefa</h2>
                    <p class="view-subtitle">Agende sua próxima atividade</p>
                </header>
                <form id="task-form" class="task-form" novalidate>
                    <div class="form-group">
                        <label for="task-title">Título da Tarefa <span class="required" aria-hidden="true">*</span></label>
                        <input type="text" id="task-title" name="title" required maxlength="100" placeholder="Ex: Reunião de equipe">
                        <span class="error-message" id="title-error" aria-live="polite"></span>
                    </div>
                    <div class="form-group">
                        <label for="task-description">Descrição</label>
                        <textarea id="task-description" name="description" maxlength="500" placeholder="Detalhes opcionais..."></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="task-date">Data <span class="required" aria-hidden="true">*</span></label>
                            <input type="date" id="task-date" name="date" required>
                            <span class="error-message" id="date-error" aria-live="polite"></span>
                        </div>
                        <div class="form-group">
                            <label for="task-time">Horário</label>
                            <input type="time" id="task-time" name="time">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="task-category">Categoria</label>
                        <select id="task-category" name="category">
                            <option value="personal">🏠 Pessoal</option>
                            <option value="work" selected>💼 Trabalho</option>
                            <option value="study">📚 Estudos</option>
                            <option value="health">🏥 Saúde</option>
                            <option value="other">📦 Outros</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="task-priority">Prioridade</label>
                        <div class="priority-options" role="radiogroup" aria-label="Prioridade">
                            <label class="priority-option">
                                <input type="radio" name="priority" value="low" aria-label="Baixa">
                                <span class="priority-indicator low"></span>
                                <span>Baixa</span>
                            </label>
                            <label class="priority-option">
                                <input type="radio" name="priority" value="medium" checked aria-label="Média">
                                <span class="priority-indicator medium"></span>
                                <span>Média</span>
                            </label>
                            <label class="priority-option">
                                <input type="radio" name="priority" value="high" aria-label="Alta">
                                <span class="priority-indicator high"></span>
                                <span>Alta</span>
                            </label>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="reset" class="btn btn-secondary">Limpar</button>
                        <button type="submit" class="btn btn-primary">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="12" y1="5" x2="12" y2="19"/>
                                <line x1="5" y1="12" x2="19" y2="12"/>
                            </svg>
                            Criar Tarefa
                        </button>
                    </div>
                </form>
            </section>

            <!-- Pending Tasks View -->
            <section class="view" id="view-pending" role="region" aria-label="Tarefas pendentes">
                <header class="view-header">
                    <h2>Tarefas Pendentes</h2>
                    <div class="view-actions">
                        <select id="pending-filter" class="filter-select" aria-label="Filtrar tarefas">
                            <option value="all">Todas</option>
                            <option value="today">Hoje</option>
                            <option value="week">Esta semana</option>
                            <option value="overdue">Atrasadas</option>
                            <option value="high">Prioridade Alta</option>
                        </select>
                        <button id="clear-completed" class="btn btn-ghost" aria-label="Limpar concluídas">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="3 6 5 6 21 6"/>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                            </svg>
                            Limpar Concluídas
                        </button>
                    </div>
                </header>
                <div class="tasks-container" id="pending-tasks" role="list" aria-label="Lista de tarefas pendentes">
                    <!-- Tasks rendered here -->
                </div>
                <div class="empty-state" id="pending-empty" hidden>
                    <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M9 11l3 3L22 4"/>
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                    </svg>
                    <h3>Nenhuma tarefa pendente</h3>
                    <p>Todas as tarefas estão em dia! 🎉</p>
                    <button class="btn btn-primary" data-view="create">Criar primeira tarefa</button>
                </div>
            </section>

            <!-- Completed Tasks View -->
            <section class="view" id="view-completed" role="region" aria-label="Tarefas concluídas">
                <header class="view-header">
                    <h2>Tarefas Concluídas</h2>
                    <div class="view-actions">
                        <select id="completed-filter" class="filter-select" aria-label="Filtrar concluídas">
                            <option value="all">Todas</option>
                            <option value="today">Hoje</option>
                            <option value="week">Esta semana</option>
                            <option value="month">Este mês</option>
                        </select>
                    </div>
                </header>
                <div class="tasks-container" id="completed-tasks" role="list" aria-label="Lista de tarefas concluídas">
                    <!-- Tasks rendered here -->
                </div>
                <div class="empty-state" id="completed-empty" hidden>
                    <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                    <h3>Nenhuma tarefa concluída</h3>
                    <p>Complete suas primeiras tarefas para vê-las aqui!</p>
                </div>
            </section>

            <!-- Calendar View -->
            <section class="view" id="view-calendar" role="region" aria-label="Visualização de calendário">
                <header class="view-header">
                    <h2>Calendário</h2>
                    <div class="calendar-nav">
                        <div class="calendar-mode-selector" role="tablist" aria-label="Modo de visualização do calendário">
                            <button class="mode-btn active" data-mode="year" role="tab" aria-selected="true" aria-controls="cal-year">Anual</button>
                            <button class="mode-btn" data-mode="month" role="tab" aria-selected="false" aria-controls="cal-month">Mensal</button>
                            <button class="mode-btn" data-mode="week" role="tab" aria-selected="false" aria-controls="cal-week">Semanal</button>
                            <button class="mode-btn" data-mode="day" role="tab" aria-selected="false" aria-controls="cal-day">Diário</button>
                        </div>
                        <div class="calendar-date-nav">
                            <button class="btn btn-icon" id="cal-prev" aria-label="Período anterior">
                                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="15 18 9 12 15 6"/>
                                </svg>
                            </button>
                            <span id="cal-current-period" class="current-period" aria-live="polite"></span>
                            <button class="btn btn-icon" id="cal-next" aria-label="Próximo período">
                                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="9 18 15 12 9 6"/>
                                </svg>
                            </button>
                            <button class="btn btn-icon btn-today" id="cal-today" aria-label="Ir para hoje">
                                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="10"/>
                                    <polyline points="12 6 12 12 16 14"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </header>
                <div class="calendar-container" role="region" aria-label="Calendário">
                    <!-- Year View -->
                    <div class="calendar-view active" id="cal-year" role="tabpanel" aria-labelledby="cal-year-tab">
                        <div class="year-grid" id="year-grid"></div>
                    </div>
                    <!-- Month View -->
                    <div class="calendar-view" id="cal-month" role="tabpanel" aria-labelledby="cal-month-tab" hidden>
                        <div class="month-header" id="month-header"></div>
                        <div class="month-grid" id="month-grid"></div>
                    </div>
                    <!-- Week View -->
                    <div class="calendar-view" id="cal-week" role="tabpanel" aria-labelledby="cal-week-tab" hidden>
                        <div class="week-header" id="week-header"></div>
                        <div class="week-grid" id="week-grid"></div>
                    </div>
                    <!-- Day View -->
                    <div class="calendar-view" id="cal-day" role="tabpanel" aria-labelledby="cal-day-tab" hidden>
                        <div class="day-header" id="day-header"></div>
                        <div class="day-timeline" id="day-timeline"></div>
                    </div>
                </div>
            </section>
        </main>

        <!-- Task Detail Modal -->
        <dialog id="task-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <div class="modal-backdrop" tabindex="-1"></div>
            <div class="modal-content">
                <header class="modal-header">
                    <h3 id="modal-title">Detalhes da Tarefa</h3>
                    <button class="modal-close" aria-label="Fechar modal">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                </header>
                <div class="modal-body" id="modal-body">
                    <!-- Task details rendered here -->
                </div>
                <footer class="modal-footer">
                    <button class="btn btn-secondary modal-close-btn">Fechar</button>
                    <button class="btn btn-danger" id="modal-delete" aria-label="Excluir tarefa">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"/>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        </svg>
                        Excluir
                    </button>
                    <button class="btn btn-primary" id="modal-toggle" aria-label="Alternar status da tarefa">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                        <span id="modal-toggle-text">Concluir</span>
                    </button>
                </footer>
            </div>
        </dialog>

        <!-- Toast Container -->
        <div id="toast-container" class="toast-container" role="status" aria-live="polite" aria-atomic="true"></div>
    </div>

    <!-- Module Entry Point -->
    <script type="module" src="src/ui/app.js"></script>
</body>
</html>
